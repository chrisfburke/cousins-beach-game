<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousin's Beach: The Complete Summer</title>
    <style>
        /* CSS: Smooth coastal aesthetics */
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #334155;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
            margin-bottom: 40px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #f8fafc;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            border: 1px solid #f1f5f9;
        }

        h1 {
            color: #0284c7;
            font-size: 2rem;
            margin: 10px 0;
            font-weight: 700;
        }

        #story-text {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 30px;
            min-height: 120px;
            text-align: left;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-btn {
            background-color: #f0f9ff;
            color: #0369a1;
            border: 2px solid #bae6fd;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .game-btn:hover {
            background-color: #fef3c7;
            color: #b45309;
            border-color: #fde68a;
            transform: translateY(-2px);
        }

        /* DIRECT AFFILIATE STOREFRONT BANNER */
        .shop-banner {
            max-width: 800px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.4s ease-in-out;
        }
        .shop-title { color: #0f172a; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .shop-subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 25px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .product-card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: all 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(14, 165, 233, 0.1); }
        .product-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .product-name { font-weight: 600; color: #1e293b; margin-bottom: 6px; font-size: 0.95rem; text-align: center; height: 40px;}
        .product-price { color: #0284c7; font-weight: 700; margin-bottom: 15px; }
        .shop-link { display: inline-block; background-color: #0284c7; color: #ffffff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; width: 80%; text-align: center; }
        .shop-link:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-bar">
            <span id="layer-tracker">Layer: 1/11</span>
            <span id="inventory-tracker">🎒 Pocket: Empty</span>
        </div>

        <h1>🌊 Cousin's Beach: The Complete Summer</h1>
        <p id="story-text">Loading vacation...</p>
        
        <div class="button-container" id="choices-container"></div>
    </div>

    <footer class="shop-banner">
        <div class="shop-title" id="store-headline">🛍 ...</div>
        <div class="shop-subtitle" id="store-subtext">...</div>
        
        <div class="products-grid" id="products-container"></div>
    </footer>

    <script>
        // GAME ENGINE VARIABLE STATE
        let inventory = "Nothing";
        let conradPoints = 0;
        let jerePoints = 0;
        let currentState = 1;

        // THE 10+ LAYER SCRIPT ENGINE DATA
        const storyNodes = {
            1: {
                layer: "1/11",
                text: "The car pulls up the gravel driveway. Cousin's Beach is just as beautiful as you remembered. As you grab your bags, who do you look for first?",
                choices: [
                    { text: "Look toward the porch to see if quiet, mysterious Conrad is there.", nextState: 2, points: { conrad: 1, jere: 0 } },
                    { text: "Scan the yard to see if Jeremiah is running out to give you a giant hug.", nextState: 3, points: { conrad: 0, jere: 1 } }
                ]
            },
            2: {
                layer: "2/11",
                text: "Conrad gives you a small, soft smile and takes your heaviest suitcase. Later that evening, you find a beautiful silver infinity charm necklace forgotten on the kitchen counter.",
                choices: [
                    { text: "Slide the necklace into your pocket. It feels important.", nextState: 4, item: "Silver Necklace", points: { conrad: 1, jere: 0 } },
                    { text: "Leave it alone. You don't want to snoop on your first night.", nextState: 4, item: "Nothing", points: { conrad: 0, jere: 0 } }
                ]
            },
            3: {
                layer: "2/11",
                text: "Jeremiah screams your name, spins you around, and insists on racing you straight down to the pool. Next to the deck chair, you spot a pair of retro tortoiseshell sunglasses.",
                choices: [
                    { text: "Put the cool sunglasses on your head. Beach style unlocked!", nextState: 4, item: "Retro Sunglasses", points: { conrad: 0, jere: 1 } },
                    { text: "Leave them on the table. They probably belong to Susannah.", nextState: 4, item: "Nothing", points: { conrad: 0, jere: 0 } }
                ]
            },
            4: {
                layer: "3/11",
                text: "The next afternoon, the beach house gets chaotic. Taylor calls you up, begging you to slip away to a local high school bonfire party down on the dunes.",
                choices: [
                    { text: "Go to the bonfire! You want to dress up, dance, and see old friends.", nextState: 5, points: { conrad: 0, jere: 1 } },
                    { text: "Stay home. You'd rather sit on the dock and watch the tide come in.", nextState: 6, points: { conrad: 1, jere: 0 } }
                ]
            },
            5: {
                layer: "4/11",
                text: "The bonfire party is crowded and loud. Suddenly, a group of local kids starts picking a fight with Jeremiah over a volleyball game setup.",
                choices: [
                    { text: "Step right in next to Jeremiah and confidently defend him.", nextState: 7, points: { conrad: 0, jere: 2 } },
                    { text: "Look around frantically for Conrad to see if he can help break it up.", nextState: 7, points: { conrad: 1, jere: 0 } }
                ]
            },
            6: {
                layer: "4/11",
                text: "It's peaceful on the dock until Conrad sits down next to you, playing chords on an acoustic guitar. He asks you if you think people ever truly change.",
                choices: [
                    { text: "'I think people can grow, but their core stays the same.'", nextState: 7, points: { conrad: 2, jere: 0 } },
                    { text: "'I think every summer is a chance to start completely over.'", nextState: 7, points: { conrad: 1, jere: 1 } }
                ]
            },
            7: {
                layer: "5/11",
                text: "Mid-July arrives: The annual Cousin's Beach Boardwalk Tournament! It's time to choose your partner for the laser-tag championship match.",
                choices: [
                    { text: "Team up with Jeremiah. He's fast, competitive, and makes it fun.", nextState: 8, points: { conrad: 0, jere: 2 } },
                    { text: "Team up with Conrad. He's super focused and has a flawless strategy.", nextState: 8, points: { conrad: 2, jere: 0 } }
                ]
            },
            8: {
                layer: "6/11",
                text: "During the game, you get cornered behind a plastic barrier. The other team is closing in fast! How do you handle the pressure?",
                choices: [
                    { text: "Launch a surprise run out in the open to distract them.", nextState: 9, points: { conrad: 0, jere: 1 } },
                    { text: "White knuckle the controls, stay perfectly still, and wait for your partner to cover your back.", nextState: 9, points: { conrad: 1, jere: 0 } }
                ]
            },
            9: {
                layer: "7/11",
                text: "Your team wins the giant golden trophy! To celebrate, everyone heads to the local ice cream stand. What flavor profile fits your vibe today?",
                choices: [
                    { text: "Classic Rocket Pop—bright, sweet, and colorful.", nextState: 10, points: { conrad: 0, jere: 1 } },
                    { text: "Dark Chocolate Mint—cool, calm, and traditional.", nextState: 10, points: { conrad: 1, jere: 0 } }
                ]
            },
            10: {
                layer: "8/11",
                text: "It's the night of the formal Country Club Debutante Ball. You look in the mirror, fully dressed up. Suddenly, you look down at your outfit and remember your pocket item...",
                choices: [
                    { text: "Check your look and head downstairs to meet your date.", nextState: 11, points: { conrad: 0, jere: 0 } }
                ]
            },
            11: { layer: "9/11", text: "Dynamic Checking...", choices: [] }
        };

        // THE DIRECT ITEM LINK MARKETPLACE DATABASE - REAL PRICES AND ALIGNED ICONS
        const storeCatalog = {
            default: {
                headline: "🛍️ Shop the Official Cousin's Look",
                subtext: "Bring the story home with these exact matching items direct from Amazon:",
                products: [
                    { icon: "📚", name: "The Complete Book Trilogy Box Set", price: "$59.99", link: "https://amzn.to/4wOF7LR" },
                    { icon: "🧥", name: "Conrad's Comfort Colors Navy Sweatshirt", price: "$29.88", link: "https://amzn.to/42PzO11" },
                    { icon: "🕶️", name: "SOJOS Retro Square Sunglasses", price: "$19.99", link: "https://amzn.to/4nN0Zmw" }
                ]
            },
            bonfire: {
                headline: "🔥 The Dune Bonfire Essentials",
                subtext: "Get set for crisp coastal nights with these matching targeted items:",
                products: [
                    { icon: "🪵", name: "Outland Living Firecube Propane Pit", price: "$179.99", link: "https://amzn.to/4nKfGH4" },
                    { icon: "🏖️", name: "Oversized Turkish Cotton Beach Blanket", price: "$25.00", link: "https://amzn.to/4fFy0Py" },
                    { icon: "📻", name: "Supersonic Retro Bluetooth Speaker", price: "$40.09", link: "https://amzn.to/4vcsqci" }
                ]
            },
            boardwalk: {
                headline: "🎟️ Boardwalk Tournament Gear",
                subtext: "Look fast and comfortable on tournament days with these product recommendations:",
                products: [
                    { icon: "🏆", name: "Gold Championship Trophy Cup 10\"", price: "$18.52", link: "https://amzn.to/4f0j7aq" },
                    { icon: "👟", name: "Vans Old Skool Core Sneakers", price: "$50.00", link: "https://amzn.to/49mWHfP" },
                    { icon: "🧢", name: "Vintage Washed Cotton Baseball Cap", price: "$12.95", link: "https://amzn.to/49mxsud" }
                ]
            },
            formal: {
                headline: "✨ Country Club Dress-Up Guide",
                subtext: "Get dressed up for the big night with these direct style items:",
                products: [
                    { icon: "👗", name: "Ever-Pretty Elegant Formal Dress", price: "$89.99", link: "https://amzn.to/4tYsQ4W" },
                    { icon: "👔", name: "Men's Bow Tie & Cufflinks Set", price: "$9.99", link: "https://amzn.to/4uuYPuF" },
                    { icon: "💎", name: "925 Sterling Silver Infinity Jewelry Set", price: "$54.90", link: "https://amzn.to/3S06xOL" }
                ]
            }
        };

        // RENDERING PIPELINE CONTROLLER
        function renderScene() {
            const node = storyNodes[currentState];
            
            document.getElementById('layer-tracker').innerText = `Layer: ${node.layer}`;
            document.getElementById('inventory-tracker').innerText = `🎒 Pocket: ${inventory}`;

            if (currentState === 11) {
                handleInventoryCheckpoint();
                return;
            }

            document.getElementById('story-text').innerHTML = node.text;

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = "";

            node.choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'game-btn';
                button.innerText = choice.text;
                
                button.onclick = () => {
                    if (choice.item) inventory = choice.item;
                    if (choice.points) {
                        conradPoints += choice.points.conrad;
                        jerePoints += choice.points.jere;
                    }
                    currentState = choice.nextState;
                    renderScene();
                };
                choicesContainer.appendChild(button);
            });

            // Target Context Mapping Engine
            if (currentState === 4 || currentState === 5 || currentState === 6) {
                updateDynamicStore('bonfire');
            } else if (currentState === 7 || currentState === 8 || currentState === 9) {
                updateDynamicStore('boardwalk');
            } else if (currentState === 10) {
                updateDynamicStore('formal');
            } else {
                updateDynamicStore('default');
            }
        }

        function updateDynamicStore(catalogKey) {
            const data = storeCatalog[catalogKey];
            
            document.getElementById('store-headline').innerText = data.headline;
            document.getElementById('store-subtext').innerText = data.subtext;

            const productsContainer = document.getElementById('products-container');
            productsContainer.innerHTML = "";

            data.products.forEach(item => {
                productsContainer.innerHTML += `
                    <div class="product-card">
                        <div class="product-icon">${item.icon}</div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price}</div>
                        <a href="${item.link}" target="_blank" class="shop-link">Amazon Details</a>
                    </div>
                `;
            });
        }

        function handleInventoryCheckpoint() {
            const choicesContainer = document.getElementById('choices-container');
            let checkpointText = "You step out into the ball room. ";

            if (inventory === "Silver Necklace") {
                checkpointText += "Conrad catches your eye across the floor. He notices you are wearing the silver infinity necklace. His eyes widen, he cuts in line past the other dancers, and takes your hand for a slow dance. 'It looks perfect on you, Belly,' he whispers.";
                document.getElementById('story-text').innerText = checkpointText;
                conradPoints += 3;
            } else if (inventory === "Retro Sunglasses") {
                checkpointText += "Jeremiah sees you approaching and flashes a massive grin. He's wearing matching sunglasses tucked into his tuxedo pocket! He pulls you to the dance floor, making the entire room laugh as you break out into goofy dance moves together.";
                document.getElementById('story-text').innerText = checkpointText;
                jerePoints += 3;
            } else {
                checkpointText += "Both brothers turn around as you walk down the grand staircase. They both look completely awestruck, holding out their hands to offer you a dance. It's the ultimate center-of-attention moment!";
                document.getElementById('story-text').innerText = checkpointText;
            }

            choicesContainer.innerHTML = `
                <button class="game-btn" onclick="triggerEnding()">🔥 Step into Chapter 10: The Final Beach Fire</button>
            `;
            updateDynamicStore('formal');
        }

        function triggerEnding() {
            document.getElementById('layer-tracker').innerText = "Layer: 11/11 (The End)";
            let title = "";
            let desc = "";

            if (conradPoints > jerePoints) {
                title = "🏆 Infinite Result: 100% Team Conrad Soulmate!";
                desc = "With a final score of " + conradPoints + " Conrad points, your summer was filled with deep stargazing conversations, hidden beach treasures, and a connection that time can't erase. You belong on the dock with Conrad!";
                updateDynamicStore('default'); 
            } else if (jerePoints > conradPoints) {
                title = "🏆 Infinite Result: 100% Team Jeremiah Golden-Hour!";
                desc = "With a final score of " + jerePoints + " Jeremiah points, your summer was an absolute blast of pool splashing, inside jokes, and endless loyalty. You and Jeremiah are the ultimate summer dream team!";
                updateDynamicStore('boardwalk'); 
            } else {
                title = "🏆 Infinite Result: Cousin's Beach Independent Legend!";
                desc = "You balanced the scale perfectly! You kept both brothers guessing, had your own epic adventures, and proved that you don't need to choose a team to own the beach.";
                updateDynamicStore('default');
            }

            document.getElementById('story-text').innerHTML = `Campfire Summary: <h3>${title}</h3><p>${desc}</p><strong>The script randomly shifts items every reset. Can you unlock all three distinct endings?</strong>`;
            
            document.getElementById('choices-container').innerHTML = `
                <button class="game-btn" style="text-align:center;" onclick="resetWholeGame()">🔄 Restart the Summer (Play Again)</button>
            `;
        }

        function resetWholeGame() {
            inventory = "Nothing";
            conradPoints = 0;
            jerePoints = 0;
            currentState = 1;
            renderScene();
        }

        window.onload = renderScene;
    </script>
</body>
</html>
